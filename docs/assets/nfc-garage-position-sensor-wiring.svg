<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#f7f4ec"/>
  <text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#213547">NFC Garage Position Sensor Wiring</text>
  <text x="60" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563">ESP32-C6 Dev Module to PN532 in SPI mode</text>

  <rect x="70" y="160" width="360" height="460" rx="24" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="130" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">ESP32-C6 Dev Module</text>

  <g font-family="Consolas, monospace" font-size="22" fill="#111827">
    <text x="110" y="280">3V3</text>
    <text x="110" y="335">GND</text>
    <text x="110" y="390">GPIO20 / SCK</text>
    <text x="110" y="445">GPIO19 / MISO</text>
    <text x="110" y="500">GPIO18 / MOSI</text>
    <text x="110" y="555">GPIO14 / SS</text>
    <text x="110" y="610">GPIO9 / Button</text>
  </g>

  <rect x="670" y="200" width="300" height="340" rx="24" fill="#fffdf8" stroke="#1f2937" stroke-width="3"/>
  <text x="760" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">PN532</text>

  <g font-family="Consolas, monospace" font-size="22" fill="#111827">
    <text x="720" y="320">VCC</text>
    <text x="720" y="375">GND</text>
    <text x="720" y="430">SCK</text>
    <text x="720" y="485">MISO</text>
    <text x="720" y="540">MOSI</text>
    <text x="720" y="595">SS / SSEL</text>
  </g>

  <g stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M430 272 C560 272, 560 300, 670 300" stroke="#16a34a"/>
    <path d="M430 327 C560 327, 560 355, 670 355" stroke="#111827"/>
    <path d="M430 382 C560 382, 560 410, 670 410" stroke="#2563eb"/>
    <path d="M430 437 C560 437, 560 465, 670 465" stroke="#dc2626"/>
    <path d="M430 492 C560 492, 560 520, 670 520" stroke="#f59e0b"/>
    <path d="M430 547 C560 547, 560 575, 670 575" stroke="#7c3aed"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#374151">
    <text x="510" y="255">3.3 V</text>
    <text x="510" y="310">Ground</text>
    <text x="515" y="365">SPI clock</text>
    <text x="510" y="420">Data from PN532</text>
    <text x="520" y="475">Data to PN532</text>
    <text x="525" y="530">Chip select</text>
  </g>

  <rect x="660" y="610" width="340" height="90" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="690" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Note</text>
  <text x="690" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563">Set the PN532 module to SPI mode before powering the board.</text>
</svg>
